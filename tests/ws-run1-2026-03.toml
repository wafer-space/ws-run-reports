# Regression configuration: ws-run1 as it was when the first density report
# was written in March 2026 (wafer-space/ws-run1 at commit aa0bfb6).
#
# The analysis of this layout must reproduce reference/ws-run1/*.csv exactly.
# See docs/provenance.md.
name = "ws-run1"
title = "wafer.space GF180MCU Run 1"
shuttle = "G801"
process = "GF180MCU"
repo = "wafer-space/ws-run1"
slots = 40

[layout]
parts = "layout/reticle-part-*"
file = "layout/reticle.oas"
md5 = "316f07f37e148457558053f4d4d11540"

[manifest]
readme = "README.md"


[measure]
# The March 2026 analysis named every library by its last part only.
library_names = "short"
# and counted the pad-layer ring of each die's seal ring as a bond pad.
count_seal_ring_pads = true
# It also counted overlapping dummy COMP and Poly2 fill as transistors.
count_fill_transistors = true
