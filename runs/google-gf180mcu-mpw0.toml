# Google / Efabless GF180MCU Open MPW shuttle GFMPW-0: Caravel dies on a synthetic reticle
title = "Google / Efabless GF180MCU Open MPW shuttle GFMPW-0"
shuttle = "GFMPW0"
slots = 40

[layout]
md5 = "366739415ab37e49a4330761db15c940"

[site]
# The short name labels the shuttle elsewhere ("Google GFMPW-0").
short_name = "GFMPW-0"
heading = ["Google GF180MCU open shuttle (GFMPW-0)", "Run by Google and Efabless"]
# Slots as in Efabless's manifest: rows lettered from the top, columns numbered from the right.
slot_origin = "top-right"
slot_letters = "rows"
# The shuttle timeline, in the format of the website's _data/runs.yml.
runs_yml_key = "gfmpw_0"
runs_yml_path = "data/schedule.yml"
timeline_source = "the Efabless GFMPW-0 shuttle page (archived) and the shuttle repositories"
timeline_source_url = "https://web.archive.org/web/20241213090115/https://platform.efabless.com/shuttles/GFMPW-0"

# Die photographs by John McMaster (Silicon Prawn), mirrored on data.wafer.space.
photos_url = "https://data.wafer.space/big-storage/siliconprawn.org/efabless/"
photos_prefix = "efabless_gf180mcu-mpw0-1800"
photos_viewer_url = "https://siliconprawn.org/map/efabless/gf180mcu-mpw0-1800{code}/{setup}/"
photos_credit = "John McMaster"
photos_credit_url = "https://siliconprawn.org/"
photos_year = 2025
photos_licence = "CC BY 4.0"
photos_licence_url = "https://creativecommons.org/licenses/by/4.0/"

[measure]
# Count only each user_project_wrapper, not the pad frame, the Caravel harness
# or the seal ring that reticle-stitcher puts around each die.
exclude = ["pad_ring", "caravel_harness", "seal_ring"]
keep = ["user_project_wrapper"]
core_cell = "user_project_wrapper"

[measure.groups]
# Everything on a Caravel die except the user's user_project_wrapper (kept above).
caravel_harness = ["caravel_core", "caravel_power_routing", "chip_io", "caravel_logo", "caravel_motto",
           "copyright_block", "open_source", "user_id_textblock"]
