# wafer.space GF180MCU Run 1
name = "ws-run1"
title = "wafer.space GF180MCU Run 1"
number = 1
shuttle = "G801"
process = "GF180MCU"
repo = "wafer-space/ws-run1"
slots = 40

[layout]
# Paths are relative to a checkout of the run repository.
parts = "layout/G801-part-*"
file = "layout/G801.oas"
md5 = "3ae7349e205f60d9f997cf7d3a688500"
layer_properties = "lyp/gf180mcu.lyp"

[manifest]
csv = "data/manifest.csv"

[images]
reticle = ["images/G801.png", "images/G801.svg"]

[site]
# Key of this run in the website's _data/runs.yml, for the shuttle timeline.
runs_yml_key = "gf180mcu_run_1"
campaign_url = "https://www.crowdsupply.com/wafer-space/gf180mcu-run-1"
# Chip-on-board bonding results, one directory per project code.
cob_repo = "wafer-space/ws-run1-cob"
cob_url = "https://wafer.space/ws-run1-cob"
# Optical die photographs, named <prefix><code>_<setup>[_th|_66p].jpg
photos_url = "https://data.wafer.space/infosecdj.net/release-1/"
photos_prefix = "wafer-space_gf180mcu-ws1-"
# Shown as "© <year> <credit>, <licence>" wherever a photograph appears.
# https://infosecdj.net/ has a self-signed certificate, so these links are http.
photos_credit = "InfoSecDJ"
photos_credit_url = "http://infosecdj.net/"
photos_year = 2026
photos_licence = "CC BY-SA 4.0"
photos_licence_url = "https://creativecommons.org/licenses/by-sa/4.0/"
# The photographer's zoomable viewer of one die; the first link on a project page.
photos_viewer_url = "http://infosecdj.net/map/wafer-space/gf180mcu-ws1-{code}/infosecdj_{setup}/"
