# Tiny Tapeout GF 0.2: die TTP2 on wafer.space Run 1 (G801), in wafer-space/tinytapeouts.
# The "reticle" is the one die; its slots are the Tiny Tapeout projects in it.
title = "Tiny Tapeout GF 0.2 on wafer.space Run 1"
shuttle = "TTP2"
slots = 52
repo = "wafer-space/tinytapeouts"
path = "ttgf0p2/ws-run1-ttp2"

[layout]
md5 = "b5f1b08305411c44c4bb3f1f5ddbbeab"
slots = "manifest"

[measure]
# Projects are a few hundred µm across: map them in 0.1 mm squares, slide the
# densest window in 20 µm steps, and count each project's whole area as core.
grid_um = 100
bin_um = 20
pad_ring_um = 0

[site]
kind = "tiny-tapeout"
# The chip's development kit in the Tiny Tapeout store.
tt_store_url = "https://store.tinytapeout.com/products/TTGF0p2-Development-Kit-P2-edition-p841828501"
tt_chip = "ttgf0p2"
heading = ["Tiny Tapeout GF 0.2", "Die TTP2 on wafer.space Run 1: the standard edition"]
slot_labels = false
# The run's schedule, with the Tiny Tapeout shuttle's own milestones (data/tt_shuttle.json) merged in.
runs_yml_key = "gf180mcu_run_1"

[site.parent]
title = "wafer.space Run 1 (G801)"
url = "https://wafer.space/ws-run1/projects/TTP2.html"

[site.render]
design_px_per_mm = 3000
design_max_px = 1600
thumb_px_per_mm = 600
thumb_max_px = 400
reticle_px_per_mm = 400
reticle_background = true
