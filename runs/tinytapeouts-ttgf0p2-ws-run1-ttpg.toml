# Tiny Tapeout GF 0.2: die TTPG on wafer.space Run 1 (G801), in wafer-space/tinytapeouts.
# The "reticle" is the one die; its slots are the Tiny Tapeout projects in it.
title = "Tiny Tapeout GF 0.2 on wafer.space Run 1"
shuttle = "TTPG"
slots = 52
repo = "wafer-space/tinytapeouts"
path = "ttgf0p2/ws-run1-ttpg"

[layout]
md5 = "b6494ef5f5770752906c875739b2f09f"
slots = "manifest"

[measure]
# Projects are a few hundred µm across: map them in 0.1 mm squares, slide the
# densest window in 20 µm steps, and count each project's whole area as core.
grid_um = 100
bin_um = 20
pad_ring_um = 0

[site]
kind = "tiny-tapeout"
# The chip's development kit in the Tiny Tapeout store.
tt_store_url = "https://store.tinytapeout.com/products/TTGF0p2-Development-Kit-PG-edition-p841828255"
tt_chip = "ttgf0p2"
heading = ["Tiny Tapeout GF 0.2", "Die TTPG on wafer.space Run 1: the power-gated edition"]
# Told apart from the other GF 0.2 die on cards that show only the first heading line.
# How this edition differs from the other, under "What was built" (HTML).
intro = '''This is the power-gated edition of Tiny Tapeout GF 0.2: it can switch off the power to the projects that are not selected. The same 52 projects were also made on the <a href="https://wafer.space/tinytapeouts/ttgf0p2/ws-run1-ttp2/">standard edition</a>, without the power switches.'''
edition = "power-gated"
slot_labels = false
# The run's schedule, with the Tiny Tapeout shuttle's own milestones (data/tt_shuttle.json) merged in.
runs_yml_key = "gf180mcu_run_1"
# The schedule after fabrication, from the planning sheet, is in website PR #145; back to the default
# (main) once it merges.
runs_yml_url = "https://raw.githubusercontent.com/wafer-space/wafer-space.github.io/run-timelines-after-fab/_data/runs.yml"

[site.parent]
title = "wafer.space Run 1 (G801)"
url = "https://wafer.space/ws-run1/projects/TTPG.html"

[site.render]
design_px_per_mm = 3000
design_max_px = 1600
thumb_px_per_mm = 600
thumb_max_px = 400
reticle_px_per_mm = 400
reticle_background = true
