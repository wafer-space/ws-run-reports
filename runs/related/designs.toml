# Designs with history on more than one chip: the same design on several wafer.space runs, or one that was
# also made on Tiny Tapeout chips. Every wafer.space slot and Tiny Tapeout project listed in a [[design]]
# shows the others on its page.
#
#   wafer_space   "<run>/<code>" of each slot, as in runs/<run>.toml and its manifest
#   tiny_tapeout  "<chip>/<macro>" of each Tiny Tapeout project (the chip as on tinytapeout.com/chips, the
#                 project's tt_um_ macro); its title and author come from index.tinytapeout.com
#   notes         a few words on how one of them differs, by the same key
#   started_on_tiny_tapeout
#                 true when the design was on Tiny Tapeout chips before it had a wafer.space slot
#
# Slots on different wafer.space runs with the same repository are related without being listed here.
# The relations below were found by matching the repositories and titles of the slots against every
# Tiny Tapeout shuttle's project index, then checked by hand.

[[design]]
name = "KianV RISC-V Linux SoC"
started_on_tiny_tapeout = true
wafer_space = ["ws-run1/KIAN", "ws-run2/KIAN"]
tiny_tapeout = ["tt05/tt_um_kianV_rv32ima_uLinux_SoC", "tt06/tt_um_kianV_rv32ima_uLinux_SoC",
                "tt07/tt_um_kianv_bare_metal", "ttihp0p2/tt_um_kianv_bare_metal", "ttihp26a/tt_um_kianv_sv32_soc"]
[design.notes]
"ws-run1/KIAN" = "5 V standard cells and SRAM"
"ws-run2/KIAN" = "3.3 V standard cells and SRAM"
"tt07/tt_um_kianv_bare_metal" = "RV32E bare-metal version"
"ttihp0p2/tt_um_kianv_bare_metal" = "RV32E bare-metal version"

