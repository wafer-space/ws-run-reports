# wafer.space GF180MCU Run 2
title = "wafer.space GF180MCU Run 2"
shuttle = "G802"
slots = 54

[layout]
md5 = "57fa57f52eac82835a051f2a353e5a30"

[site]
heading = ["wafer.space Run 2"]
# The shuttle timeline: this run's key in the wafer.space website's _data/runs.yml.
runs_yml_key = "gf180mcu_run_2"
campaign_url = "https://www.crowdsupply.com/wafer-space/gf180mcu-run-2"

# Names for projects whose own name says too little or is a raw repository name.
[site.display_names]
AS16 = "AS16 16-bit RISC CPU"
ISHI = "ISHI-KAI multi-project die 2"

[measure]
