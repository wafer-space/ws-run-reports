# Google GF180MCU test shuttle MPW-18H1 (a private run on GlobalFoundries' MPW service): Caravel dies on a synthetic reticle
title = "Google GF180MCU test shuttle MPW-18H1"
shuttle = "GFMPW18H1"
slots = 4

[layout]
md5 = "e65f93005a41a1c997298f8b4abfc07c"

[site]
# The short name labels the shuttle elsewhere ("Google MPW-18H1").
short_name = "MPW-18H1"
heading = ["Google GF180MCU test shuttle (MPW-18H1)", "Made on a private GlobalFoundries MPW run"]
# The 2 x 2 arrangement is synthetic, so the slots get no row and column labels.
slot_labels = false
# Draw the 2 x 2 on a wafer.space-sized reticle frame, so the dies appear at the
# same scale as on the ws-run1 and ws-run2 pages.
reticle_frame_mm = [30.0, 23.379]
# The shuttle timeline, in the format of the website's _data/runs.yml.
runs_yml_key = "gfmpw_18h1"
runs_yml_path = "data/schedule.yml"
timeline_source = "the shuttle repositories, the dies' GDS headers, the OpenFASoC paper and the Silicon Prawn photographs (no schedule was published for this private shuttle)"
timeline_source_url = "https://foss-eda-tools.googlesource.com/third_party/shuttle/gf180mcu/mpw-18h1"

# Die photographs by John McMaster (Silicon Prawn), mirrored on data.wafer.space.
photos_url = "https://data.wafer.space/big-storage/siliconprawn.org/efabless/"
photos_prefix = "efabless_gf180mcu-mpw18h1-1810"
photos_viewer_url = "https://siliconprawn.org/map/efabless/gf180mcu-mpw18h1-1810{code}/{setup}/"
photos_credit = "John McMaster"
photos_credit_url = "https://siliconprawn.org/"
photos_year = 2025
photos_licence = "CC BY 4.0"
photos_licence_url = "https://creativecommons.org/licenses/by/4.0/"
# Photographs of the packed dies (Gel-Pak boxes), one folder per die.
package_photos_url = "https://data.wafer.space/big-storage/siliconprawn.org/efabless/package/"
package_photos_dir = "gf180mcu-mpw18h1-1810{code}/"

[measure]
# Count only each user_project_wrapper, not the pad frame, the Caravel harness
# or the seal ring that reticle-stitcher puts around each die.
exclude = ["pad_ring", "caravel_harness", "seal_ring"]
keep = ["user_project_wrapper"]
core_cell = "user_project_wrapper"

[measure.groups]
# Everything on a Caravel die except the user's user_project_wrapper (kept above).
caravel_harness = ["caravel_core", "caravel_power_routing", "chip_io", "caravel_logo", "caravel_motto",
           "copyright_block", "open_source", "user_id_textblock"]
