[project]
name = "ws-run-reports"
version = "0.1.0"
description = "Generators for wafer.space run reports: density statistics, layout renders and per-run web pages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "klayout",
    "jinja2",
    "pillow",
    "pyyaml>=6.0.3",
]

[project.scripts]
ws-run-reports = "ws_run_reports.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_run_reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
